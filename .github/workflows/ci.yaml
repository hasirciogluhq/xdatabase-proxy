name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# All jobs run in parallel; setup-go caches the module and build caches (keyed on go.sum).
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -cover ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # go install keeps the compiled tool in the build cache; go run @latest rebuilt it every time.
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Render kustomizations
        run: |
          for d in kubernetes/production/* kubernetes/development; do
            echo "::group::$d"; kubectl kustomize "$d" > /dev/null; echo "::endgroup::"
          done

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o bin/linux-amd64/xdatabase-proxy ./cmd/proxy
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          build-args: SRC=prebuilt
          tags: xdatabase-proxy:ci
      - name: Cache Trivy database
        uses: actions/cache@v6
        with:
          path: .trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - name: Scan image
        run: |
          mkdir -p .trivy
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.trivy:/root/.cache/trivy" \
            aquasec/trivy:latest image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 xdatabase-proxy:ci

  # Real databases in Docker, queried with their own CLIs through the proxy (see scripts/e2e.sh).
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [postgres, redis, clickhouse, mongodb]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: E2E_ONLY=${{ matrix.db }} scripts/e2e.sh
