name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -cover ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/proxy

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render kustomizations
        run: |
          for d in kubernetes/production/* kubernetes/development; do
            echo "::group::$d"; kubectl kustomize "$d" > /dev/null; echo "::endgroup::"
          done

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: xdatabase-proxy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 xdatabase-proxy:ci

  e2e:
    # Real PostgreSQL behind the proxy: connect through "user.deployment".
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_PASSWORD: secret}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run proxy and query through it
        env:
          PGPASSWORD: secret
        run: |
          go build -o proxy ./cmd/proxy
          STATIC_BACKENDS=e2e=127.0.0.1:5432 PROXY_START_PORT=6432 ./proxy &
          sleep 2
          for mode in require disable; do
            psql "host=127.0.0.1 port=6432 user=postgres.e2e dbname=postgres sslmode=$mode" -tAc "select 'ok-$mode'" | grep "ok-$mode"
          done
