name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# All jobs run in parallel; setup-go caches the module and build caches (keyed on go.sum).
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -cover ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # go install keeps the compiled tool in the build cache; go run @latest rebuilt it every time.
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render kustomizations
        run: |
          for d in kubernetes/production/* kubernetes/development; do
            echo "::group::$d"; kubectl kustomize "$d" > /dev/null; echo "::endgroup::"
          done

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o bin/linux-amd64/xdatabase-proxy ./cmd/proxy
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          build-args: SRC=prebuilt
          tags: xdatabase-proxy:ci
      - name: Cache Trivy database
        uses: actions/cache@v4
        with:
          path: .trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - name: Scan image
        run: |
          mkdir -p .trivy
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.trivy:/root/.cache/trivy" \
            aquasec/trivy:latest image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 xdatabase-proxy:ci

  e2e:
    # Real PostgreSQL behind the proxy: connect through "user.deployment".
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_PASSWORD: secret}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run proxy and query through it
        env:
          PGPASSWORD: secret
        run: |
          go build -o proxy ./cmd/proxy
          STATIC_BACKENDS=e2e=127.0.0.1:5432 PROXY_START_PORT=6432 ./proxy &
          for i in $(seq 20); do curl -fs localhost:8080/ready && break; sleep 0.5; done
          for mode in require disable; do
            psql "host=127.0.0.1 port=6432 user=postgres.e2e dbname=postgres sslmode=$mode" -tAc "select 'ok-$mode'" | grep "ok-$mode"
          done

  e2e-redis:
    # Real Redis behind the proxy: username routing ("default.cache1" is rewritten to "default").
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start Redis and the proxy
        run: |
          sudo apt-get install -y --no-install-recommends redis-tools
          docker run -d --name redis -p 6379:6379 redis:7-alpine redis-server --requirepass secret
          go build -o proxy ./cmd/proxy
          DATABASE_TYPE=redis STATIC_BACKENDS=cache1=127.0.0.1:6379 PROXY_START_PORT=6433 HEALTH_SERVER_PORT=8081 ./proxy &
          for i in $(seq 20); do curl -fs localhost:8081/ready && break; sleep 0.5; done
          for i in $(seq 20); do redis-cli -p 6379 -a secret --no-auth-warning ping && break; sleep 0.5; done
      - name: Query through the proxy
        run: |
          redis-cli -p 6433 --user default.cache1 --pass secret --no-auth-warning set k v | grep OK
          redis-cli -p 6433 --user default.cache1 --pass secret --no-auth-warning get k | grep '^v$'
          redis-cli -p 6433 --tls --insecure --user default.cache1 --pass secret --no-auth-warning ping | grep PONG
