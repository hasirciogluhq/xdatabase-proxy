apiVersion: apps/v1
kind: Deployment
metadata:
  name: xdatabase-proxy
spec:
  replicas: 1
  selector:
    matchLabels: {app: xdatabase-proxy}
  template:
    metadata:
      labels: {app: xdatabase-proxy}
    spec:
      serviceAccountName: xdatabase-proxy
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 40
      containers:
        - name: proxy
          image: ghcr.io/hasirciogluhq/xdatabase-proxy-development:development
          imagePullPolicy: Always
          ports:
            - name: postgresql
              containerPort: 5432
            - name: health
              containerPort: 8080
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DISCOVERY_MODE
              value: kubernetes
            - name: TLS_ENABLED
              value: "true"
            - name: TLS_MODE
              value: memory
            - name: DEBUG
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 512Mi}
          livenessProbe:
            httpGet: {path: /health, port: health}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /ready, port: health}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: xdatabase-proxy
spec:
  type: ClusterIP
  selector: {app: xdatabase-proxy}
  ports:
    - {name: postgresql, port: 5432, targetPort: postgresql}
